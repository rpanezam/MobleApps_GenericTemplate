# Trigger new run
name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  flutter-jobs:
    name: Flutter CI (Analyze, Audit, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap Monorepo
        run: melos bootstrap

      - name: Flutter Analyze
        run: melos run analyze

      - name: Flutter Pub Audit
        run: melos exec -- "flutter pub audit"

      - name: Flutter Test
        run: melos run test

  backend-jobs:
    name: .NET Backend CI (Vulnerability Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: .NET Restore
        run: dotnet restore backend/AppFactory.Backend.csproj

      - name: Check for NuGet Vulnerabilities
        run: dotnet list backend/AppFactory.Backend.csproj package --vulnerable

      - name: .NET Build
        run: dotnet build backend/AppFactory.Backend.csproj --configuration Release --no-restore

  deploy-jobs:
    name: Build & Push Container to GCP Artifact Registry
    needs: [flutter-jobs, backend-jobs]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional Google Cloud Authentication
      # Uncomment and configure these steps when GCP credentials are added to GitHub Secrets
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}

      # - name: Set up Cloud SDK
      #   uses: google-github-actions/setup-gcloud@v2

      # - name: Configure Docker client
      #   run: |
      #     gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/app-factory/backend:${{ github.sha }} ./backend

      # - name: Push Docker Image
      #   run: |
      #     docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/app-factory/backend:${{ github.sha }}

